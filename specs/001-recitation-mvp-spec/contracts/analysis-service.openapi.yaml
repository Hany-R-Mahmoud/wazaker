openapi: 3.1.0
info:
  title: Wazaker Recitation Analysis Service
  version: 0.1.0
  description: >
    Contract for comparing a learner's recorded recitation against a selected
    Quran target passage. This contract is intentionally confidence-aware and
    limited to memorization revision, not tajweed grading.
servers:
  - url: https://analysis.example.com
paths:
  /v1/recitation/analyze:
    post:
      summary: Analyze one recitation attempt
      operationId: analyzeRecitationAttempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeRecitationRequest'
      responses:
        '200':
          description: Structured comparison result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeRecitationResponse'
        '400':
          description: Invalid request
        '422':
          description: Audio or target could not be analyzed reliably
        '503':
          description: Analysis service unavailable
components:
  schemas:
    AnalyzeRecitationRequest:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - target
        - audio
        - locale
      properties:
        attemptId:
          type: string
        locale:
          type: string
          enum: [ar, en]
        target:
          $ref: '#/components/schemas/TargetPassage'
        audio:
          type: object
          additionalProperties: false
          required:
            - uri
            - durationMs
            - mimeType
          properties:
            uri:
              type: string
            durationMs:
              type: integer
              minimum: 1
            mimeType:
              type: string
    AnalyzeRecitationResponse:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - targetPassageId
        - overallConfidence
        - confidenceBand
        - summary
        - segments
        - retryRecommended
        - manualVerificationRecommended
      properties:
        attemptId:
          type: string
        targetPassageId:
          type: string
        overallConfidence:
          type: number
          minimum: 0
          maximum: 1
        confidenceBand:
          type: string
          enum: [high, medium, low]
        summary:
          type: object
          additionalProperties: false
          required: [ar, en]
          properties:
            ar:
              type: string
            en:
              type: string
        segments:
          type: array
          items:
            $ref: '#/components/schemas/ComparisonSegment'
        retryRecommended:
          type: boolean
        manualVerificationRecommended:
          type: boolean
    TargetPassage:
      type: object
      additionalProperties: false
      required:
        - id
        - selectionType
        - displayName
        - canonicalText
        - canonicalReference
      properties:
        id:
          type: string
        selectionType:
          type: string
          enum: [page, surah, ayahRange]
        pageNumber:
          type:
            - integer
            - 'null'
          minimum: 1
        surahNumber:
          type:
            - integer
            - 'null'
          minimum: 1
        ayahStart:
          type:
            - integer
            - 'null'
          minimum: 1
        ayahEnd:
          type:
            - integer
            - 'null'
          minimum: 1
        displayName:
          type: object
          additionalProperties: false
          required: [ar, en]
          properties:
            ar:
              type: string
            en:
              type: string
        canonicalText:
          type: string
        canonicalReference:
          type: string
    ComparisonSegment:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - expectedText
        - confidence
        - startTokenIndex
        - endTokenIndex
        - message
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [match, omission, insertion, substitution, uncertain]
        expectedText:
          type: string
        observedText:
          type:
            - string
            - 'null'
        confidence:
          type: number
          minimum: 0
          maximum: 1
        startTokenIndex:
          type: integer
          minimum: 0
        endTokenIndex:
          type: integer
          minimum: 0
        message:
          type: object
          additionalProperties: false
          required: [ar, en]
          properties:
            ar:
              type: string
            en:
              type: string
